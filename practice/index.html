<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studiolo Practice App</title>
<link rel="stylesheet" href="styles.css">

</head>
<body>
<header>
  <h1>Studiolo Practice App</h1>
  <p>Produce, don't consume. Every miss goes to the mistake log, and anything wrong twice becomes an Anki card.</p>
</header>
<div id="storage-status" role="status" hidden></div>
<div id="notices"></div>
<nav class="tabs" id="tabs">
  <button class="tab active" data-panel="sprint">Exam sprint</button>
  <button class="tab" data-panel="review">Spaced review</button>
  <button class="tab" data-panel="picker">Pair picker</button>
  <button class="tab" data-panel="visual">Visual drills</button>
  <button class="tab" data-panel="flash">Flashcard blitz</button>
  <button class="tab" data-panel="progress">Progress &amp; export</button>
</nav>
<main>
  <section class="panel active" id="panel-sprint"></section>
  <section class="panel" id="panel-review"></section>
  <section class="panel" id="panel-picker"></section>
  <section class="panel" id="panel-visual"></section>
  <section class="panel" id="panel-flash"></section>
  <section class="panel" id="panel-progress"></section>
</main>

<script src="topics.js"></script>
<script src="questions.js"></script>
<script src="core.js"></script>
<script src="storage.js"></script>
<script src="ui.js"></script>
<script src="drills.js"></script>
<script src="review.js"></script>
<script src="visual.js"></script>
<script src="flash.js"></script>
<script src="app.js"></script>
</body>
</html>
