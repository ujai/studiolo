name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported (README promises 3.9+) and a current release.
        python-version: ["3.9", "3.13"]
    steps:
      # Pinned to a commit, not a moving tag, so a changed tag can't run new code here.
      # Dependabot (.github/dependabot.yml) opens a PR when a new release is out.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Learner map is valid
        run: python whats_due.py --check
      - name: practice/topics.js matches learner-map.md
        run: python generate_topics.py --check
